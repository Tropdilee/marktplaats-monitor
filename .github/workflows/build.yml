# Builds the app for Linux, Windows and macOS.
#
# PyInstaller can only build for the system it runs on, so the same build step
# runs on three machines at once here. The result is attached to the run as a
# download, and on a tag it also appears under Releases.
name: Build the app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned rather than ubuntu-latest: a PyInstaller bundle only runs on
          # systems with the same or a newer glibc than the build machine. This
          # one needs glibc 2.38, so it runs on Ubuntu 24.04 and newer; built on
          # a newer Ubuntu it would stop running on 24.04.
          - os: ubuntu-24.04
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: System libraries for Qt (Linux only)
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libegl1 libgl1

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run the tests
        # Regression tests for the search backend, saved lists, profiles and the
        # settings migration. A failure here stops the build before anything is
        # packaged or released.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

      - name: Build
        run: python -m PyInstaller packaging/miaw.spec --noconfirm

      - name: Run the self-test
        # Checks inside the built app that Qt, the data folder, the keyring and
        # the connection to Marktplaats work. Without a graphical session Qt runs
        # here without a window. The check lives in a script rather than inline,
        # because the Windows runner uses PowerShell where a heredoc does not
        # parse.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/ci_selftest.py

      - name: Package (Linux/macOS)
        if: matrix.label != 'windows'
        run: |
          cd dist
          if [ -d "MIAW Marktplaats Monitor.app" ]; then
            hdiutil create -volname "MIAW Marktplaats Monitor" \
              -srcfolder "MIAW Marktplaats Monitor.app" \
              -ov -format UDZO "MIAW-Marktplaats-Monitor-${{ matrix.label }}.dmg"
          else
            tar czf "MIAW-Marktplaats-Monitor-${{ matrix.label }}.tar.gz" "MIAW Marktplaats Monitor"
          fi

      - name: Package (Windows)
        if: matrix.label == 'windows'
        run: |
          Compress-Archive -Path "dist\MIAW Marktplaats Monitor" `
            -DestinationPath "dist\MIAW-Marktplaats-Monitor-windows.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: MIAW-Marktplaats-Monitor-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: downloads
      - uses: softprops/action-gh-release@v3
        with:
          files: downloads/**/*
