# Builds the app for Linux, Windows and macOS.
#
# PyInstaller can only build for the system it runs on, so the same build step
# runs on three machines at once here. The result is attached to the run as a
# download, and on a tag it also appears under Releases.
name: Build the app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries for Qt (Linux only)
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libegl1 libgl1

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: python -m PyInstaller packaging/miaw.spec --noconfirm

      - name: Run the self-test
        # Checks inside the built app that Qt, the data folder, the keyring and
        # the connection to Marktplaats work. Without a graphical session Qt runs
        # here without a window.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import subprocess, sys, glob, os
          candidates = glob.glob("dist/**/MIAW Marktplaats Monitor", recursive=True)
          candidates += glob.glob("dist/**/MIAW Marktplaats Monitor.exe", recursive=True)
          executables = [c for c in candidates if os.path.isfile(c)]
          if not executables:
              sys.exit("no built app found")
          r = subprocess.run([executables[0], "--selftest"], capture_output=True, text=True)
          print(r.stdout or r.stderr)
          # The Telegram and keyring checks cannot pass on a build machine; only
          # a crash is a problem here.
          if "self-test" not in (r.stdout or "") and "zelftest" not in (r.stdout or ""):
              sys.exit("the app did not start")
          PY

      - name: Package (Linux/macOS)
        if: matrix.label != 'windows'
        run: |
          cd dist
          if [ -d "MIAW Marktplaats Monitor.app" ]; then
            hdiutil create -volname "MIAW Marktplaats Monitor" \
              -srcfolder "MIAW Marktplaats Monitor.app" \
              -ov -format UDZO "MIAW-Marktplaats-Monitor-${{ matrix.label }}.dmg"
          else
            tar czf "MIAW-Marktplaats-Monitor-${{ matrix.label }}.tar.gz" "MIAW Marktplaats Monitor"
          fi

      - name: Package (Windows)
        if: matrix.label == 'windows'
        run: |
          Compress-Archive -Path "dist\MIAW Marktplaats Monitor" `
            -DestinationPath "dist\MIAW-Marktplaats-Monitor-windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MIAW-Marktplaats-Monitor-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/**/*
